name = "catatku"
main = "worker/index.ts"
compatibility_date = "2024-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "catatku-db"
database_id = "local-d1-placeholder"

# Pengingat Cron Triggers (Setiap 5 menit untuk mengecek jatuh tempo)
[triggers]
crons = ["*/5 * * * *"]
